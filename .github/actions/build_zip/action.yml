name: Build and zip exe

inputs:
  version:
    description: Optional version override for the archive
    required: false
    default: ""

outputs:
  version:
    description: The application version
    value: ${{ steps.build_zip.outputs.version }}
  zip_path:
    description: The path to the versioned ZIP archive
    value: ${{ steps.build_zip.outputs.zip_path }}

runs:
  using: composite
  steps:
    - name: Build & Zip exe
      id: build_zip
      shell: powershell
      env:
        VERSION_OVERRIDE: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:VERSION_OVERRIDE
        if ([string]::IsNullOrWhiteSpace($version)) {
          $version = python -m src.tools.release_metadata version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        # build.py writes forward-slash ZIP entries and rejects any archive the updater's stage_release refuses.
        python build.py --archive-version $version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $zipName = "d4lf_v" + $version + ".zip"
        python -m src.tools.release_archive verify $zipName
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        echo "zip_path=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
