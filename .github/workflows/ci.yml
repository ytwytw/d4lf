name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup env
        uses: ./.github/actions/setup_env
      - name: Scan tracked content for private data
        shell: powershell
        run: uv run --frozen python -m src.tools.public_safety --tree HEAD
      - name: Run prek
        uses: j178/prek-action@v2
      - name: Pytest
        shell: powershell
        run: pytest . -m "not selenium" -v -n logical
#      - name: Pytest selenium
#        shell: powershell
#        run: pytest . -m "selenium" -v
