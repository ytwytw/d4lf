name: Locale data watch

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  source-drift:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup env
        uses: ./.github/actions/setup_env
      - name: Check locked locale sources
        shell: powershell
        run: |
          uv run --frozen python -m src.tools.season_data_watch `
            --source-lock assets/catalog/source-lock.json |
            Tee-Object -FilePath locale-data-report.json
          exit $LASTEXITCODE
      - name: Upload locale data report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-data-report
          path: locale-data-report.json
          retention-days: 14
