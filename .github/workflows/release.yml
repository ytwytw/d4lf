name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    if: |
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          contains(github.event.pull_request.labels.*.name, 'release')
        )
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Setup env
        uses: ./.github/actions/setup_env
      - name: Scan release tree for private data
        shell: powershell
        run: uv run --frozen python -m src.tools.public_safety --tree HEAD
      - name: Require locale and bundled-source publication readiness
        shell: powershell
        run: uv run --frozen python -m src.tools.release_check
      - name: Validate release version
        id: release_version
        shell: powershell
        run: uv run --frozen python -m src.tools.release_metadata github-output $env:GITHUB_OUTPUT
      - name: Refuse an existing tag or release
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            if (releases.some((release) => release.tag_name === tag)) {
              core.setFailed(`A release or draft for ${tag} already exists; bump src/__init__.py.`);
              return;
            }
            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}` });
              core.setFailed(`Tag ${tag} already exists; bump src/__init__.py.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Run release checks
        uses: j178/prek-action@v3.0.0
      - name: Run regression suite (excluding Selenium)
        shell: powershell
        run: uv run --frozen pytest . -m "not selenium" -n logical
      - name: Build & Zip exe
        id: build_zip
        uses: ./.github/actions/build_zip
        with:
          version: ${{ steps.release_version.outputs.version }}
      - name: Render user-facing release notes
        shell: powershell
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: uv run --frozen python -m src.tools.release_metadata notes --repository $env:GITHUB_REPOSITORY --ref $env:RELEASE_TAG --output release-body.md
      # A draft keeps generated artifacts private until a maintainer reviews the notes and publishes it.
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-body.md
          draft: true
          files: ${{ steps.build_zip.outputs.zip_path }}
          name: "v${{ steps.release_version.outputs.version }}"
          prerelease: ${{ steps.release_version.outputs.prerelease == 'true' }}
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          token: "${{ secrets.RELEASE_TOKEN || github.token }}"
          fail_on_unmatched_files: true
