default_install_hook_types = ["pre-commit", "pre-push"]
default_language_version = { python = "python3.14" }
minimum_prek_version = "0.4.8"

[[repos]]
hooks = [
  {
    id = "ty",
    name = "ty check",
    entry = "uv run --frozen --all-extras --all-groups ty check .",
    language = "system",
    pass_filenames = false,
    priority = 4294967295
  }
]
repo = "local"

[[repos]]
hooks = [{ id = "uv-lock", priority = 4294967294 }]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "d9fca3320346514799461a80b0753eb45d707d46"  # 0.11.28

[[repos]]
hooks = [
  {
    id = "check-added-large-files",
    priority = 4294967295,
    exclude = '^assets/catalog/source-manifest\.json$'
  },
  { id = "check-case-conflict", priority = 4294967295 },
  { id = "check-executables-have-shebangs", priority = 4294967295 },
  { id = "check-json", priority = 4294967295 },
  { id = "check-toml", priority = 4294967295 },
  { id = "check-yaml", priority = 4294967295 },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker", exclude = "^tts/sign_dll.ps1" },
  { id = "trailing-whitespace" }
]
repo = "builtin"

[[repos]]
hooks = [
  {
    id = "mdformat",
    priority = 4294967294,
    additional_dependencies = ["mdformat-gfm"]
  }
]
repo = "https://github.com/executablebooks/mdformat"
rev = "82912cdaea4fb830f751504486a7879c70526547"  # 1.0.0

[[repos]]
hooks = [
  {
    id = "pretty-format-yaml",
    priority = 4294967294,
    args = ["--autofix", "--preserve-quotes", "--offset", "2"]
  }
]
repo = "https://github.com/macisamuele/language-formatters-pre-commit-hooks"
rev = "4380fbb73a154b5f5624794c1c78d9719ccc860f"  # v2.16.0

[[repos]]
hooks = [{ id = "clang-format", priority = 4294967294, files = '\.(cpp|h)$' }]
repo = "https://github.com/pre-commit/mirrors-clang-format"
rev = "f4d7745e17a28aad7eed2f4874ca8d1568c11c4c"  # v22.1.8

[[repos]]
hooks = [
  { id = "check-ast", priority = 4294967295 },
  { id = "detect-private-key", priority = 4294967295 },
  {
    id = "pretty-format-json",
    args = ["--autofix", "--indent=4", "--no-ensure-ascii"],
    priority = 4294967294
  }
]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # v6.0.0

[[repos]]
hooks = [
  { id = "ruff-format", priority = 4294967294 },
  { id = "ruff-check", priority = 4294967293, args = ["--fix"] }
]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "01a675ea018f2fb714478a5ffb83fcea8374bb06"  # v0.15.21

[[repos]]
hooks = [{ id = "tombi-format", exclude = "^uv.lock", priority = 4294967294 }]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "fcb0ac886b00dd0305756b1e8466432e11601b5a"  # v1.2.0

[[repos]]
hooks = [
  {
    id = "powershell-analyzer",
    name = "PowerShell analyzer",
    entry = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check_powershell.ps1",
    language = "system",
    files = '\.ps1$',
    priority = 4294967295
  },
  {
    id = "public-safety-index",
    name = "public safety scan (index)",
    entry = "uv run python -m src.tools.public_safety --index",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-commit"]
  },
  {
    id = "documentation-parity",
    name = "bilingual documentation parity",
    entry = "uv run --frozen --all-groups python -m src.tools.documentation_check",
    language = "system",
    pass_filenames = false,
    always_run = true,
    priority = 4294967295
  },
  {
    id = "public-safety-head",
    name = "public safety scan (HEAD)",
    entry = "uv run python -m src.tools.public_safety --tree HEAD",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  }
]
repo = "local"
